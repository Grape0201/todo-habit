<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オフライン - todo-habit</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .offline-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 60vh;
      padding: 24px;
    }
    .offline-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .offline-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .offline-desc {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.6;
      max-width: 360px;
    }
  </style>
</head>
<body>
  <main>
    <div class="offline-container">
      <div class="offline-icon">📡</div>
      <div class="offline-title">オフラインです</div>
      <div class="offline-desc">
        インターネットまたはサーバーに接続できません。<br>
        接続状況を確認してから再度お試しください。
      </div>
      <button class="btn primary" onclick="window.location.reload()">再読み込み</button>
    </div>
  </main>
</body>
</html>
