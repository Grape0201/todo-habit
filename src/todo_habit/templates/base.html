<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f6bff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="todo-habit">
  <title>{% block title %}todo-habit{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192x192.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="nav">
    <a href="/" class="{{ 'on' if nav == 'today' }}"><span class="ic">✅</span>今日</a>
    <a href="/upcoming" class="{{ 'on' if nav == 'upcoming' }}"><span class="ic">📅</span>予定</a>
    <a href="/todos" class="{{ 'on' if nav == 'todos' }}"><span class="ic">🗂</span>管理</a>
    <a href="/logs" class="{{ 'on' if nav == 'logs' }}"><span class="ic">🔎</span>ログ</a>
    <a href="/categories" class="{{ 'on' if nav == 'categories' }}"><span class="ic">🏷</span>カテゴリ</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <a class="fab" href="/todos/new" aria-label="新規作成">＋</a>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.error('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
